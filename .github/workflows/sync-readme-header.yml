name: Sync README header

on:
  push:
    branches: [main]
    paths:
      - "snippets/readme-header.md"
      - "snippets/readme-sync.json"
      - "assets/logo/**"
      - "scripts/sync_readme_header.py"
      - ".github/workflows/sync-readme-header.yml"
  workflow_dispatch:
    inputs:
      seed:
        description: "Insert header markers when missing"
        type: boolean
        default: false
      dry_run:
        description: "Compute diffs only (no push / PR)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout .github
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: App token (runkrate)
        id: token-runkrate
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.KRATE_RELEASE_BOT_APP_ID || secrets.KRATE_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.KRATE_RELEASE_BOT_PRIVATE_KEY }}
          owner: runkrate

      - name: App token (krate-apps)
        id: token-krate-apps
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.KRATE_RELEASE_BOT_APP_ID || secrets.KRATE_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.KRATE_RELEASE_BOT_PRIVATE_KEY }}
          owner: krate-apps

      - name: Sync header into target repositories
        env:
          README_SYNC_TOKEN_RUNKRATE: ${{ steps.token-runkrate.outputs.token }}
          README_SYNC_TOKEN_KRATE_APPS: ${{ steps.token-krate-apps.outputs.token }}
          # Optional legacy override
          README_SYNC_TOKEN: ${{ secrets.README_SYNC_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.seed }}" = "true" ]; then
              ARGS+=(--seed)
            fi
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              ARGS+=(--dry-run)
            fi
          fi
          python3 scripts/sync_readme_header.py "${ARGS[@]}"
